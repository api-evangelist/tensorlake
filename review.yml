    - POST   https://api.tensorlake.ai/sandboxes/{sandbox_id}/snapshot
    - POST   https://api.tensorlake.ai/sandboxes/{sandbox_id}/suspend
    - POST   https://api.tensorlake.ai/sandboxes/{sandbox_id}/resume
  endpointsModeled:
    - note: All request and response BODY schemas in openapi/tensorlake-openapi.yml are modeled from Tensorlake documentation and SDK behavior. Paths, methods, base URL, and Bearer auth are confirmed against Tensorlake's published OpenAPI document; field-level schemas are illustrative and should be verified against the live spec.
sources:
  - url: https://docs.tensorlake.ai/api-reference/introduction
    type: APIReference
    note: API reference introduction; base URL and endpoint groups.
  - url: https://docs.tensorlake.ai/api-reference/openapi.yaml
    type: OpenAPI
    note: Tensorlake's published OpenAPI 3.1.0 document; source of the confirmed path list and methods. Title "Tensorlake API", version 0.1.0, server https://api.tensorlake.ai/.
  - url: https://docs.tensorlake.ai/platform/authentication
    type: Documentation
    note: API key (tl_apiKey_) passed as Authorization Bearer token.
  - url: https://docs.tensorlake.ai/document-ingestion/parsing
    type: Documentation
    note: Document parsing flow and options (chunking, tables, OCR, structured extraction).
  - url: https://docs.tensorlake.ai/webhooks/overview
    type: Documentation
    note: Webhook callbacks for job completion. HTTP callbacks, not WebSocket.
  - url: https://www.tensorlake.ai/pricing
    type: Documentation
    note: Credit model (1 credit = $0.01), per-page document pricing, sandbox compute meters, Free/On-Demand/Pro/Enterprise tiers.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Tensorlake's public API. The API is
    request/response REST plus an asynchronous job-polling model and optional
    webhook callbacks - none of which is a server-push socket transport. No
    AsyncAPI document was created and no asyncapi/ artifact was added.
