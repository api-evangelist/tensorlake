description: >-
  FinOps view of Tensorlake Cloud spend. Tensorlake bills on a credit model
  where 1 credit equals $0.01. Document ingestion is metered primarily by the
  page (published rates put parsing and extraction near $10 per 1,000 pages),
  while serverless workflows and MicroVM sandboxes are metered on compute - CPU
  per hour, RAM per GB-hour, disk per GB-hour, and snapshot storage per
  GB-month - billed by the second. A Pro subscription ($250/month + usage) adds
  discounted compute rates, and Enterprise agreements cover high-volume or
  in-VPC deployments.
notes: >-
  Per-unit rates are not reconciled here. The $10-per-1,000-pages document rate
  and the sandbox compute meters come from the Tensorlake pricing page and
  third-party listings; verify current numbers during reconciliation.
