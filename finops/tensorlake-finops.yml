meters:
- name: document_pages
  description: Pages of documents parsed / extracted through the Document Ingestion API, billed in credits (~$10 per 1,000 pages).
  unit: pages
  aggregation: sum
  dimensions:
  - project
  - dataset
- name: sandbox_cpu
  description: CPU time consumed by MicroVM sandboxes, billed per hour and metered by the second.
  unit: hours
  aggregation: sum
  dimensions:
  - project
  - sandbox
- name: sandbox_memory
  description: RAM consumed by sandboxes, billed per GB-hour.
  unit: gb_hours
  aggregation: sum
  dimensions:
  - project
  - sandbox
- name: sandbox_disk
  description: Disk consumed by sandboxes, billed per GB-hour.
  unit: gb_hours
  aggregation: sum
  dimensions:
  - project
  - sandbox
- name: snapshot_storage
  description: Sandbox snapshot storage, billed per GB-month.
  unit: gb_months
  aggregation: sum
  dimensions:
  - project
principles:
- name: Visibility
  description: Track pages processed per project and dataset, and sandbox CPU/RAM/disk/snapshot usage per sandbox, to see where credits are spent.
- name: Allocation
  description: Name projects, datasets, and sandboxes per workload/team so page and compute spend map to internal cost centers.
- name: Optimization
  description: Scope page ranges and chunking to only the content you need; suspend idle sandboxes to pause compute billing; consolidate repeated document types into datasets with a shared configuration.
- name: Accountability
  description: Assign owners per project; review monthly page volume and sandbox compute against the plan's credit allowance or Pro subscription.
